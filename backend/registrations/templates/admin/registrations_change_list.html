{% extends "admin/change_list.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
  <li style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px;">
    <!-- زر تصدير دورة معينة وتصفير عدادها -->
    <div style="display: inline-flex; align-items: center; gap: 6px; background: #F8FAFC; border: 1px solid #CBD5E1; padding: 3px 8px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
      <label for="courseExportSelect" style="font-size: 11px; font-weight: 700; color: #334155; margin: 0; white-space: nowrap;">
        📁 تصدير دورة وتصفير عدادها:
      </label>
      <select id="courseExportSelect" style="padding: 4px 8px; border-radius: 6px; border: 1px solid #94A3B8; font-size: 11px; font-weight: 600; color: #0F172A; background: #FFFFFF; max-width: 220px;">
        <option value="">-- اختر الدورة المطلوبة --</option>
        <optgroup label="الدورات التقنية والبرمجية">
          {% for c in available_courses %}
            <option value="{{ c.course_id }}">{{ c.title }}</option>
          {% endfor %}
        </optgroup>
        <optgroup label="دبلوم اللغة الإنجليزية TechLingo">
          {% for lvl in techlingo_levels %}
            <option value="{{ lvl.course_id }}">{{ lvl.title }}</option>
          {% endfor %}
        </optgroup>
      </select>
      <button type="button" onclick="exportCourseAndReset()" style="background-color: #0284C7; color: white; border: none; font-weight: bold; font-size: 11px; padding: 5px 12px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 1px 3px rgba(2, 132, 199, 0.3);">
        <span>تصدير الدورة 📥</span>
      </button>
    </div>

    <!-- زر تصدير كافة الطلاب الشامل -->
    <a href="export-all-excel/" class="button" style="background-color: #10B981 !important; color: white !important; font-weight: bold; padding: 6px 14px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.25);">
      <span>📊 تصدير السجل العام (كافة الدورات)</span>
    </a>
  </li>

  <script>
    function exportCourseAndReset() {
      var select = document.getElementById('courseExportSelect');
      var courseId = select ? select.value : '';
      if (!courseId) {
        alert('يرجى اختيار الدورة التدريبية التي ترغب في تصديرها وتصفير عدادها أولاً.');
        return;
      }
      var selectedText = select.options[select.selectedIndex].text;
      var confirmMsg = 'هل أنت متأكد من رغبتك في تصدير ملف Excel لدورة:\n(' + selectedText + ')\n\nسيتم تنزيل ملف الإكسل المستقل لهذه الدورة، وأرشفة المقبولين حالياً وتصفير عداد مقاعد الدورة في الموقع إلى 0 لتبدأ دفعة جديدة.';
      if (confirm(confirmMsg)) {
        window.location.href = 'export-course-excel/' + encodeURIComponent(courseId) + '/';
      }
    }
  </script>

  {{ block.super }}
{% endblock %}
